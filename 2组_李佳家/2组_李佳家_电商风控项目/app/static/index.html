<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="电商风险控制系统 - 实时风险识别、规则匹配、案件审核与运营看板">
    <title>电商风险控制系统 · 风险检查</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <div class="brand">
                <div class="brand-mark">
                    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="M12 2.8l7.2 3.1v5.3c0 4.7-3.1 8.4-7.2 9.9-4.1-1.5-7.2-5.2-7.2-9.9V5.9L12 2.8z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
                        <path d="M8.8 12.1l2.1 2.1 4.3-4.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <div class="brand-text">
                    <strong>RiskShield</strong>
                    <span>电商风险控制系统</span>
                </div>
            </div>

            <div class="nav-label">风控工作台</div>
            <nav class="nav" id="main-nav" aria-label="主导航">
                <a href="#/check" data-page="check" class="nav-item">
                    <span class="nav-icon">
                        <svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8"/><path d="M16.5 16.5L21 21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M8 11h6M11 8v6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
                    </span>
                    <span>风险检查</span>
                    <span class="nav-dot"></span>
                </a>
                <a href="#/rules" data-page="rules" class="nav-item">
                    <span class="nav-icon">
                        <svg viewBox="0 0 24 24" fill="none"><rect x="4" y="3.5" width="16" height="17" rx="2.5" stroke="currentColor" stroke-width="1.8"/><path d="M8 8h8M8 12h8M8 16h5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
                    </span>
                    <span>规则管理</span>
                </a>
                <a href="#/cases" data-page="cases" class="nav-item">
                    <span class="nav-icon">
                        <svg viewBox="0 0 24 24" fill="none"><path d="M3.5 7.5a2 2 0 012-2h4l2 2.2h7a2 2 0 012 2v8a2 2 0 01-2 2h-13a2 2 0 01-2-2v-10.2z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M8 13.5h8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
                    </span>
                    <span>案件管理</span>
                    <span class="nav-badge" id="nav-case-badge" hidden>0</span>
                </a>
                <a href="#/blacklist" data-page="blacklist" class="nav-item">
                    <span class="nav-icon">
                        <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.8"/><path d="M6 6l12 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
                    </span>
                    <span>黑名单管理</span>
                </a>
                <a href="#/profile" data-page="profile" class="nav-item">
                    <span class="nav-icon">
                        <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.6" stroke="currentColor" stroke-width="1.8"/><path d="M5 20c.6-3.5 3.3-5.6 7-5.6s6.4 2.1 7 5.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
                    </span>
                    <span>用户画像</span>
                </a>
                <a href="#/dashboard" data-page="dashboard" class="nav-item">
                    <span class="nav-icon">
                        <svg viewBox="0 0 24 24" fill="none"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
                    </span>
                    <span>运营看板</span>
                </a>
            </nav>

            <div class="sidebar-agent">
                <div class="sidebar-agent-head">
                    <span class="pulse-dot"></span>
                    <span>风险 Agent</span>
                    <span class="agent-online">运行中</span>
                </div>
                <p>确定性六步编排，全链路留痕</p>
                <div class="agent-flow">
                    <span>校验</span><i></i><span>特征</span><i></i><span>规则</span><i></i><span>决策</span><i></i><span>黑名单</span><i></i><span>建案</span>
                </div>
            </div>

            <div class="sidebar-footer">
                <div class="footer-status"><span class="status-dot"></span> 离线模式 · 服务正常</div>
                <div class="footer-version">RiskShield v1.0.0</div>
            </div>
        </aside>

        <div class="main-area">
            <header class="topbar">
                <div class="breadcrumb">
                    <span>风控中心</span>
                    <svg viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M4.5 2.5L8 6l-3.5 3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    <strong id="breadcrumb-page">风险检查</strong>
                </div>
                <div class="topbar-right">
                    <div class="engine-pill">
                        <span class="status-dot"></span>
                        <span>规则引擎正常</span>
                    </div>
                    <div class="topbar-divider"></div>
                    <div class="topbar-clock">
                        <strong id="clock-time">--:--</strong>
                        <span id="clock-date">----</span>
                    </div>
                    <div class="topbar-divider"></div>
                    <div class="user-chip">
                        <div class="avatar">张</div>
                        <div class="user-chip-text">
                            <strong>张晨</strong>
                            <span>风控管理员</span>
                        </div>
                    </div>
                </div>
            </header>

            <main class="page" id="page-content" aria-live="polite"></main>
        </div>
    </div>

    <div class="toast-container" id="toast-container" aria-live="polite"></div>
    <div id="modal-root"></div>
    <div id="drawer-root"></div>

    <script src="/app.js"></script>
</body>
</html>
